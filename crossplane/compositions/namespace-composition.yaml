apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xnamespace-aws
  labels:
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: platform.company.io/v1alpha1
    kind: XNamespace

  resources:
    # 1. Namespace
    - name: namespace
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha1
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: v1
              kind: Namespace
              metadata:
                labels:
                  managed-by: crossplane
                  platform.company.io/team: ""        # patched below
                  platform.company.io/env: ""         # patched below
      patches:
        - fromFieldPath: spec.parameters.team
          toFieldPath: spec.forProvider.manifest.metadata.name
          transforms:
            - type: string
              string:
                fmt: "team-%s"
        - fromFieldPath: spec.parameters.team
          toFieldPath: spec.forProvider.manifest.metadata.labels[platform.company.io/team]
        - fromFieldPath: spec.parameters.environment
          toFieldPath: spec.forProvider.manifest.metadata.labels[platform.company.io/env]

    # 2. ResourceQuota
    - name: resource-quota
      base:
        apiVersion: kubernetes.crossplane.io/v1alpha1
        kind: Object
        spec:
          forProvider:
            manifest:
              apiVersion: v1
              kind: ResourceQuota
              metadata:
                name: default-quota
              spec:
                hard:
                  requests.cpu: "4"
                  requests.memory: 8Gi
                  limits.cpu: "8"
                  limits.memory: 16Gi
                  pods: "50"
      patches:
        - fromFieldPath: spec.parameters.team
          toFieldPath: spec.forProvider.manifest.metadata.namespace
          transforms:
            - type: string
              string:
                fmt: "team-%s"
        - fromFieldPath: spec.parameters.resourceQuota.cpu
          toFieldPath: spec.forProvider.manifest.spec.hard[requests.cpu]
        - fromFieldPath: spec.parameters.resourceQuota.memory
          toFieldPath: spec.forProvider.manifest.spec.hard[requests.memory]

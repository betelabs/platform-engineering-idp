# Golden-path defaults — override per service
replicaCount: 2

image:
  repository: ghcr.io/your-org/your-app
  pullPolicy: IfNotPresent
  tag: ""   # set by CI using image digest

serviceAccount:
  create: true
  annotations: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5

podDisruptionBudget:
  enabled: true
  minAvailable: 1

podMonitor:
  enabled: true
  path: /metrics
  port: 8080

labels:
  app: ""
  team: ""
  env: ""
  version: ""

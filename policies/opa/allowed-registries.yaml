apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: allowed-registries
spec:
  match:
    kinds:
      - apiGroups: ['']
        kinds: [Pod]
    excludedNamespaces: [kube-system, gatekeeper-system, crossplane-system]
  parameters:
    repos:
      - ghcr.io/your-org/
      - public.ecr.aws/
      - gcr.io/your-project/
